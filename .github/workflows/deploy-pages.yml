name: Deploy a talk to GitHub Pages

# 登壇資料 1 本ずつを GitHub Pages に公開する。
#   https://<owner>.github.io/<repo>/            … 登壇一覧（自動生成）
#   https://<owner>.github.io/<repo>/<talk>/     … 各登壇
#
# 公開したい登壇のフォルダ名でタグを打つ:
#   git tag flutterkaigi_mini_lt-v1
#   git push origin flutterkaigi_mini_lt-v1
# → タグ名から "-v..." を除いた talks/<name> だけをビルドして公開する。
# 他の登壇は gh-pages 上にそのまま残る（keep_files）。
#
# 事前に一度だけ: Settings → Pages → Build and deployment →
# Source を「Deploy from a branch」/ Branch を「gh-pages」「/ (root)」に設定。

on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      talk:
        description: '公開する登壇フォルダ名（talks/ 直下）'
        required: true

permissions:
  contents: write

# gh-pages への push が競合しないよう直列化する。
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve talk name
        id: t
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            talk="${{ github.event.inputs.talk }}"
          else
            talk="${GITHUB_REF_NAME%-v*}"   # 例: flutterkaigi_mini_lt-v1 → flutterkaigi_mini_lt
          fi
          echo "talk=$talk" >> "$GITHUB_OUTPUT"
          test -f "talks/$talk/pubspec.yaml" || { echo "::error::talks/$talk/pubspec.yaml が見つかりません"; exit 1; }
          test -d "talks/$talk/web" || { echo "::error::talks/$talk に web がありません"; exit 1; }

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true

      - name: Build the talk
        run: |
          set -euo pipefail
          repo="${{ github.event.repository.name }}"
          talk="${{ steps.t.outputs.talk }}"
          flutter pub get
          ( cd "talks/$talk" && flutter build web --release --base-href "/$repo/$talk/" )

      # 対象の登壇だけを <talk>/ に配置。他の登壇は残す。
      - name: Publish talk to gh-pages/<talk>
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: talks/${{ steps.t.outputs.talk }}/build/web
          destination_dir: ${{ steps.t.outputs.talk }}
          keep_files: true

      # gh-pages 上に存在する登壇を全部拾って一覧 index を作り直す。
      - name: Rebuild index from gh-pages
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "$tmp/gh"

          links=""
          for d in "$tmp"/gh/*/; do
            name="$(basename "$d")"
            case "$name" in .*) continue;; esac
            [ -f "$d/index.html" ] || continue
            links="${links}      <li><a href=\"./$name/\">$name</a></li>\n"
          done

          mkdir -p site
          {
            echo '<!doctype html>'
            echo '<html lang="ja"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>flutter-slides</title>'
            echo '<style>'
            echo 'body{font-family:system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;background:#0D1117;color:#fff}'
            echo 'h1{color:#5EC9F7}a{color:#5EC9F7;text-decoration:none}a:hover{text-decoration:underline}'
            echo 'ul{list-style:none;padding:0}li{margin:.6em 0;font-size:1.25rem}'
            echo '</style></head><body>'
            echo '<h1>flutter-slides</h1>'
            echo '<p>よわよわエンジニアの Flutter 登壇資料</p>'
            echo '<ul>'
            printf "%b" "$links"
            echo '</ul></body></html>'
          } > site/index.html
          touch site/.nojekyll

      - name: Publish index
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true
